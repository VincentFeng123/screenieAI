[package]
name = "screenieai"
version = "0.1.0"
description = "Screen AI lens — hotkey-triggered region capture + AI analysis"
authors = ["Vincent Feng"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "screenieai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# P-F: pin to current minor so a future cargo update doesn't silently
# move us to a Tauri minor with bundler / signing behavior changes.
tauri-build = { version = "~2.6", features = [] }
cc = "1"

[dependencies]
# P-F: pinned to current minor (Tauri 2.11.x). Bump when upgrading and
# re-run the manual QA smoke before tagging a release.
tauri = { version = "~2.11", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "~2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["process", "fs", "rt", "macros", "time"] }
image = { version = "0.25", default-features = false, features = ["png"] }
imageproc = "0.25"
ab_glyph = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
cpal = "0.18"
voice_activity_detector = "0.2"
rubato = "0.16"
# Agent target-intent gate + text-targeted resolution: Jaro-Winkler scoring
# for fuzzy label matching (tiny, zero transitive deps).
strsim = "0.11"
# Perception index (see/read/look): bundled so FTS5 is guaranteed and there
# is no system-SQLite version skew; the only SQL storage in the app.
rusqlite = { version = "0.32", features = ["bundled"] }

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-global-shortcut = "~2.3"

# Windows-only: WinRT + Win32 bindings.
#
# WinRT features power on-device OCR via `Windows.Media.Ocr.OcrEngine` (the
# same engine PowerToys / OneNote / Snip & Sketch use) and bitmap decoding.
#
# Win32_* features power the native overlay bridge (`windows_window.rs`):
# layered/no-activate/topmost styles, low-level keyboard/mouse hooks for
# Esc consumption and partial click-through, `SetWindowDisplayAffinity` for
# exclude-self capture, GDI BitBlt for region capture (`capture/win.rs`),
# DWM for Mica/dark-mode on the Settings window, and `ShellExecute` for the
# Ollama installer launch and the screen-capture privacy deep link.
#
# Everything is built into Windows 10+ — no extra runtime to bundle.
[target."cfg(target_os = \"windows\")".dependencies]
whisper-rs = "0.16"
windows = { version = "0.58", features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target."cfg(target_os = \"macos\")".dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
enigo = "0.6"
# Streaming GIF encoder for screen-recording clips (raw `gif`, NOT `image`'s
# gif feature — that would switch on GIF decoding inside every existing
# image::load_from_memory call site).
gif = "0.13"
whisper-rs = { version = "0.16", features = ["metal"] }
xcap = "=0.9.6"

# GIF encoding is per-pixel work (NeuQuant quantization + LZW) on a live
# frame tap with a bounded 4-slot channel: unoptimized debug builds encode
# ~20x slower and silently drop most frames. Optimizing just these crates
# keeps dev-build GIF QA representative without slowing the rest of the
# debug build.
[profile.dev.package.color_quant]
opt-level = 3
[profile.dev.package.gif]
opt-level = 3
[profile.dev.package.weezl]
opt-level = 3
# Same story for the still-image stack: every perception frame round-trips
# PNG encode/decode of up to Retina-sized bitmaps.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
